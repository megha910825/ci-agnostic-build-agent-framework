name: CI — Build and Test Agents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base agent
        run: docker build -t build-agent:base ./agents/base

      - name: Build python agent
        run: docker build -t build-agent:python ./agents/python

      - name: Build node agent
        run: docker build -t build-agent:node ./agents/node

      - name: Build java agent
        run: docker build -t build-agent:java ./agents/java

      - name: Verify all images exist
        run: |
          docker images | grep build-agent

  test-images:
    name: Test Docker Images
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build all images
        run: docker compose build

      - name: Install test dependencies
        run: pip install pytest

      - name: Run pytest tests
        run: pytest tests/ -v

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint base Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/base/Dockerfile
          ignore: DL3008,DL3009

      - name: Lint python Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/python/Dockerfile
          ignore: DL3008,DL3013

      - name: Lint node Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/node/Dockerfile
          ignore: DL3008

      - name: Lint java Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/java/Dockerfile
          ignore: DL3008
