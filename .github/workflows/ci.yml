name: CI — Build and Test Agents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint base Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/base/Dockerfile
          ignore: DL3008 DL3009 DL3066

      - name: Lint python Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/python/Dockerfile
          ignore: DL3008 DL3009 DL3013 DL3066

      - name: Lint node Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/node/Dockerfile
          ignore: DL3008 DL3009 DL3016 DL3066

      - name: Lint java Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agents/java/Dockerfile
          ignore: DL3008 DL3009 DL3066

  build-and-test:
    name: Build Images and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Build base agent
        run: docker build -t build-agent:base ./agents/base

      - name: Build python agent
        run: docker build -t build-agent:python ./agents/python

      - name: Build node agent
        run: docker build -t build-agent:node ./agents/node

      - name: Build java agent
        run: docker build -t build-agent:java ./agents/java

      - name: Verify all images exist
        run: docker images | grep build-agent

      - name: Run pytest tests
        run: pytest tests/ -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
