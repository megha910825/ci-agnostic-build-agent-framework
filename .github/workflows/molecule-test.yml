name: Molecule Tests

on:
  push:
    branches: [main]
    paths: ['ansible/**']
  pull_request:
    branches: [main]
    paths: ['ansible/**']

jobs:
  molecule:
    name: Molecule — ${{ matrix.role }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # if one role fails, others still run
      matrix:
        role:
          - agent-setup

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Molecule + dependencies
        run: |
          pip install \
            molecule \
            molecule-docker \
            ansible \
            ansible-lint \
            pytest \
            pytest-testinfra

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            community.general \
            community.docker

      - name: Run Molecule tests — ${{ matrix.role }}
        run: |
          cd ansible/roles/${{ matrix.role }}
          molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_NO_LOG: 'false'

