---
name: Molecule Tests

on:
  push:
    branches: [main]
    paths: ['ansible/**']
  pull_request:
    branches: [main]
    paths: ['ansible/**']

jobs:
  molecule:
    name: Molecule — ${{ matrix.role }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        role:
          - agent-setup
          - docker-install
          - agent-hardening

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Molecule + dependencies
        run: |
          pip install \
            "ansible-core==2.15.13" \
            "molecule==6.0.3" \
            "molecule-docker==2.1.0" \
            "ansible-lint==24.2.3"

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            community.general \
            community.docker \
            ansible.posix

      - name: Run Molecule tests — ${{ matrix.role }}
        run: |
          cd ansible/roles/${{ matrix.role }}
          molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_NO_LOG: 'false'
