---
all:
  children:
    build_agents:
      hosts:
        # Local test — uses localhost (for testing without a real VM)
        agent-local:
          ansible_host: localhost
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
# Real VM example — uncomment and fill in when you have a server
        # agent-01:
        #   ansible_host: 192.168.1.10
        #   ansible_user: ubuntu
        #   ansible_ssh_private_key_file: ~/.ssh/id_rsa

        # Cloud VM examples
        # agent-aws:
        #   ansible_host: ec2-xx-xx-xx-xx.compute-1.amazonaws.com
        #   ansible_user: ubuntu
        #   ansible_ssh_private_key_file: ~/.ssh/aws-key.pem

        # agent-azure:
        #   ansible_host: 20.xx.xx.xx
        #   ansible_user: azureuser
        #   ansible_ssh_private_key_file: ~/.ssh/azure-key.pem

      vars:
        # Default vars for ALL hosts in this group
        ci_system: github-actions
        agent_user: build-agent
        agent_work_dir: /opt/build-agent
        agent_version: "2.311.0"
        harden_agent: true

