---
- name: Converge — run agent-setup role
  hosts: all
  become: true
  gather_facts: true

  vars:
    ci_system: github-actions
    agent_user: build-agent
    agent_work_dir: /opt/build-agent
    agent_version: "2.311.0"
    docker_enabled: true
    harden_agent: false   # skip hardening in test — needs full systemd

  roles:
    - role: agent-setup
