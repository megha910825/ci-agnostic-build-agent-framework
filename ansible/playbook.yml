---
- name: Provision CI Build Agent
  hosts: build_agents
  become: true
  gather_facts: true

  vars:
    ci_system: "{{ ci_system | default('github-actions') }}"

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true

  roles:
    - role: docker-install
      tags: [docker]

    - role: agent-setup
      tags: [agent]

    - role: agent-hardening
      tags: [hardening]
      when: harden_agent | default(true)

  post_tasks:
    - name: Verify agent service is running
      ansible.builtin.systemd:
        name: build-agent
      register: agent_service
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Print agent status (real run)
      ansible.builtin.debug:
        msg: "✅ Build agent provisioned successfully on {{ inventory_hostname }}"
      when: not ansible_check_mode

    - name: Print agent status (check mode)
      ansible.builtin.debug:
        msg: "✅ Dry run complete — playbook is valid for {{ inventory_hostname }}"
      when: ansible_check_mode
