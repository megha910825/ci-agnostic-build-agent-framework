---
- name: Ensure openssh-server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
  become: true

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  become: true
  notify: restart sshd
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set agent directory permissions
  ansible.builtin.file:
    path: "{{ agent_work_dir | default('/opt/build-agent') }}"
    owner: "{{ agent_user | default('build-agent') }}"
    group: "{{ agent_user | default('build-agent') }}"
    mode: '0750'
    recurse: true
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restrict agent config file permissions
  ansible.builtin.file:
    path: "{{ agent_work_dir | default('/opt/build-agent') }}/.agent-config"
    owner: "{{ agent_user | default('build-agent') }}"
    mode: '0600'
  become: true
  ignore_errors: true

- name: Install fail2ban for brute force protection
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  become: true

- name: Enable fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set up UFW firewall — allow SSH only
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
