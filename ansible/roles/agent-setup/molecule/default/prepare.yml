---
- name: Prepare container for Ansible testing
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.command: systemctl is-system-running
      register: systemd_status
      retries: 10
      delay: 3
      until: systemd_status.stdout in ['running', 'degraded']
      changed_when: false
      ignore_errors: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - sudo
          - curl
          - git
        state: present
        update_cache: true

    - name: Create docker group for testing
      ansible.builtin.group:
        name: docker
        state: present
